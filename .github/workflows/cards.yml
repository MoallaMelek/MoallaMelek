name: Update profile cards

on:
  schedule:
    - cron: "17 * * * *" # hourly; GitHub may delay scheduled runs
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - README.md
      - scripts/generate_cards.py
      - scripts/refresh_profile_views.py
      - .github/workflows/cards.yml

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh profile views snapshot
        env:
          GH_USER: ${{ github.repository_owner }}
        run: python scripts/refresh_profile_views.py

      - name: Generate SVG cards
        env:
          # Optional: add a METRICS_TOKEN secret (classic PAT, read:user + repo)
          # to include private contributions; falls back to the built-in token.
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python scripts/generate_cards.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          git diff --cached --quiet || git commit -m "chore: refresh profile cards"
          git push
