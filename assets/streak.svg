<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180" fill="none" role="img">
<style>
  text { font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Sans-Serif; }
  .title { font-size: 18px; font-weight: 600; fill: #58A6FF; }
  .label { font-size: 14px; fill: #C9D1D9; }
  .value { font-size: 14px; font-weight: 700; fill: #C9D1D9; }
  .muted { font-size: 12px; fill: #8B949E; }
  .fade { opacity: 0; animation: fade .5s ease-in-out forwards; }
  @keyframes fade { to { opacity: 1; } }
</style>
<rect x="0.5" y="0.5" rx="10" width="899" height="179" fill="#0D1117" stroke="#30363D"/>
<text x="25" y="35" class="title">GitHub Streak</text>
<text x="150" y="90" text-anchor="middle" class="value" style="font-size:32px;fill:#7EE787">29</text>
<text x="150" y="122" text-anchor="middle" class="label">Active days</text>
<text x="450" y="90" text-anchor="middle" class="value" style="font-size:32px;fill:#7EE787">21</text>
<text x="450" y="122" text-anchor="middle" class="label">Current streak</text>
<text x="750" y="90" text-anchor="middle" class="value" style="font-size:32px;fill:#7EE787">21</text>
<text x="750" y="122" text-anchor="middle" class="label">Longest streak</text>
<text x="450" y="158" text-anchor="middle" class="muted">Consecutive contribution days · UTC · today can still be completed</text>
</svg>
